<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientists Timeline Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root { --sidebar-width: 300px; }
    html,body{margin:0;height:100%;font-family:system-ui,sans-serif;}
    #graph{position:absolute;top:0;left:0;right:var(--sidebar-width);bottom:0;}
    #sidebar{position:absolute;top:0;right:0;bottom:0;width:var(--sidebar-width);overflow-y:auto;border-left:1px solid #e0e0e0;padding:1rem;background:#fafafa;}
    #sidebar h2{margin-top:0;}
    .node:hover{cursor:pointer;}
  </style>
</head>
<body>
<div id="graph"></div>
<div id="sidebar"><em>Click on a scientist to see details…</em></div>

<script>
/****************************
 * CONFIG
 ****************************/
const MATRIX_CSV  = 'person_reference_matrix.csv'; // adjacency matrix
const SLUGS_TXT   = 'slugs.txt';                   // one slug per line
const NAMES_TXT   = 'names.txt';                   // one printable name per line
const BIRTHS_TXT  = 'birth_years.txt';             // one birth‑year per line (int)
const BIOS_TXT    = 'bios.txt';                    // one bio per line (name: bio)
const PORTRAIT_DIR= 'portraits/';                  // portrait folder
const PORTRAIT_EXTS = ['jpg','jpeg','png'];        // extension fallback order
const SIZE_RANGE   = [40, 90];                     // min‑max portrait size px

const width  = window.innerWidth - parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'));
const height = window.innerHeight;

/****************************
 * SVG + ZOOM scaffold
 ****************************/
const svg = d3.select('#graph')
  .append('svg')
  .attr('width', width)
  .attr('height', height)
  .call(
    d3.zoom().scaleExtent([0.25,6])
            .on('zoom', ({transform}) => mainG.attr('transform', transform))
  );

const mainG   = svg.append('g');
const gridG   = mainG.append('g').attr('class','grid');
const linkG   = mainG.append('g').attr('class','links');
const nodeG   = mainG.append('g').attr('class','nodes');
const defs    = svg.append('defs');

/****************************
 * DATA LOADING
 ****************************/
function safeFilename(text) {
	  const keep = new Set('abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-');
	  return Array.from(text)
	    .map(c => keep.has(c) ? c : '_')
	    .join('');
}

Promise.all([
  d3.text(SLUGS_TXT),
  d3.text(NAMES_TXT),
  d3.text(BIRTHS_TXT),
  d3.text(BIOS_TXT),
  d3.csv(MATRIX_CSV, d3.autoType)
]).then(([slugText, nameText, birthText, bioText, matrixRows]) => {
  const slugs  = slugText.trim().split(/\r?\n/);
  const names  = nameText.trim().split(/\r?\n/);
  const births = birthText.trim().split(/\r?\n/).map(Number);
  const bios   = bioText.trim().split(/\r?\n/).map(line => {
    const colonIndex = line.indexOf(':');
    return colonIndex > 0 ? line.substring(colonIndex + 1).trim() : '';
  });

  if(!(slugs.length===names.length && slugs.length===births.length && slugs.length===bios.length)) {
    console.error('⚠ Slug/Name/Birth/Bio lists have different lengths.');
  }

  /********* Build Node Skeleton *********/
  const rawNodes = slugs.map((slug,i)=>({
    id: slug,
    name: names[i] || slug,
    birth: births[i] || null,
    bio: bios[i] || ''
  }));

  // y‑scale (ignore nulls)
  const yearVals = rawNodes.filter(d=>d.birth!==null).map(d=>d.birth);
  const yScale = d3.scaleLinear()
                   .domain([d3.min(yearVals), d3.max(yearVals)])
                   .range([0, height*10]);

  /********* Build In‑degree counts + link list *********/
  const slugField   = matrixRows.columns[0];
  const targetSlugs = matrixRows.columns.slice(1);
  const inDeg = new Map(slugs.map(s=>[s,0]));
  const links = [];
  matrixRows.forEach(row => {
    const src = row[slugField];
    targetSlugs.forEach(tgt => {
      if(+row[tgt]===1) {
        links.push({source:src,target:tgt});
        inDeg.set(tgt,(inDeg.get(tgt)||0)+1);
      }
    });
  });

  const degValues = Array.from(inDeg.values());
  const sizeScale = (degValues.every(v=>v===degValues[0]))
      ? () => (SIZE_RANGE[0]+SIZE_RANGE[1])/2 // if all equal use mid size
      : d3.scaleLinear().domain(d3.extent(degValues)).range(SIZE_RANGE);

  /********* Finalise Nodes *********/
  const nodes = rawNodes.map(d=>{
    const sz = sizeScale(inDeg.get(d.id))**1.2;
    return {
      ...d,
      size: sz/3,
      x: width/2 + (Math.random()*50-25),
      y: yScale(d.birth),
      img: PORTRAIT_DIR + safeFilename(d.id) + '.jpg'
    };
  });

  /********* Backdrop Grid (centuries) *********/
  const minYear = d3.min(yearVals);
  const maxYear = d3.max(yearVals);
  const centuryStart = Math.floor(minYear/100)*100;
  const centuryEnd   = Math.ceil(maxYear/100)*100;
  const centuries = d3.range(centuryStart, centuryEnd+1, 100);

  gridG.selectAll('line').data(centuries).enter()
    .append('line')
      .attr('x1',0).attr('x2',width)
      .attr('y1',d=>yScale(d)).attr('y2',d=>yScale(d))
      .attr('stroke','#d0d0d0').attr('stroke-dasharray','4 4');

  gridG.selectAll('text').data(centuries).enter()
    .append('text')
      .attr('x',4).attr('y',d=>yScale(d)-4)
      .attr('font-size','10px').attr('fill','#666')
      .text(d=>d+'s');

  /********* Clip‑paths per node *********/
  defs.selectAll('clipPath').data(nodes).enter()
    .append('clipPath')
      .attr('id',d=>'clip-'+d.id)
      .append('circle')
        .attr('r',d=>d.size/2)
        .attr('cx',d=>d.size/2)
        .attr('cy',d=>d.size/2);

  /********* Render Links *********/
  const linkElems = linkG.selectAll('line').data(links).enter()
    .append('line')
      .attr('stroke','#999').attr('stroke-opacity',0.2);

  /********* Render Nodes *********/
  const nodeElems = nodeG.selectAll('image').data(nodes).enter()
    .append('image')
      .attr('width',d=>d.size)
      .attr('height',d=>d.size)
      .attr('clip-path',d=>'url(#clip-'+d.id+')')
      .attr('href',d=>d.img)
      .attr('transform',d=>`translate(${d.x-d.size/2},${d.y-d.size/2})`)
      .classed('node',true)
      .each(function(d){ // fallback ext loader
        let idx=0;
        this.onerror = () => {
          idx++;
          if(idx<PORTRAIT_EXTS.length){ this.setAttribute('href', PORTRAIT_DIR+safeFilename(d.id)+'.'+PORTRAIT_EXTS[idx]); }
        };
      })
      .on('click',(e,d)=>showDetails(d));

  /********* Force Simulation *********/
  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(1000))
    .force('collide', d3.forceCollide(d=>d.size/2 + 6))
    .force('x', d3.forceX(width/2).strength(0.05))
    .force('y', d3.forceY(d=>yScale(d.birth)).strength(10))
    .on('tick',tick);

  function tick(){
    nodeElems.attr('transform',d=>`translate(${d.x-d.size/2},${d.y-d.size/2})`);
    linkElems
      .attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  }

  /********* Sidebar Details *********/
  const sidebar = d3.select('#sidebar');
  function showDetails(d){
    const linksIn = inDeg.get(d.id) || 0;
    sidebar.html(`<h2>${d.name}</h2>`+
                 `<img src="${d.img}" style="width:100%;border-radius:8px;margin-bottom:1rem;" onerror="this.onerror=null;for(let ext of ${JSON.stringify(PORTRAIT_EXTS)}){this.src='${PORTRAIT_DIR}'+safeFilename('${d.id}')+'.'+ext;if(this.complete)break;}">`+
                 
                 `<p><strong>Born:</strong> ${d.birth}</p>`+
                 `<p><strong>Connections:</strong> ${linksIn}</p>`+
                 `<p>${d.bio}</p>`+
                 `<p><a href="https://en.wikipedia.org/wiki/${d.id}" target="_blank">Wikipedia ↗</a></p>`);
  }
});
</script>
</body>
</html>
